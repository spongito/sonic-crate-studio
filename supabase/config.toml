
# project_id is the only required field
project_id = "lovable"

[api]
# Enabled by default. Set to 'false' to disable the API.
enabled = true
# Port to use for the API URL.
port = 54321
# Additional environment variables that should be passed to the API.
preview_env_vars = []

[db]
# Port to use for the local database URL.
port = 54322

[realtime]
enabled = true

[inbucket]
# Enabled by default for local development.
enabled = true

[storage]
# Enabled by default. Set to 'false' to disable the storage.
enabled = true

[auth]
# Enabled by default. Set to 'false' to disable auth.
enabled = true

[auth.email]
enabled = true

[functions]
# Enabled by default. Set to 'false' to disable functions.
enabled = true

[functions.process-music-request]
verify_jwt = true

[functions.increment-playlist-count]
verify_jwt = true

[functions.check-subscription]
verify_jwt = true

[functions.create-checkout]
verify_jwt = true

[functions.spotify-search]
verify_jwt = true
